<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeopathway Clinical Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        .display-font {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-100 px-6">
    <div class="w-full max-w-md bg-slate-900/40 border border-slate-800/80 p-8 rounded-3xl backdrop-blur-md shadow-2xl relative overflow-hidden">
        
        <!-- Glowing Ambient Circles -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/10 rounded-full blur-2xl"></div>

        <div class="text-center space-y-2 mb-8 relative">
            <span class="text-3xl">🩺</span>
            <h1 class="text-2xl font-black tracking-tight text-white display-font">HOMEOPATHWAY</h1>
            <p class="text-xs text-slate-400">Clinical Dashboard & EMR Portal Login</p>
        </div>

        <form id="loginForm" class="space-y-4 relative">
            <div id="errorMsg" class="hidden p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs rounded-xl text-center"></div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 block">Doctor Email</label>
                <input type="email" id="email" required placeholder="drvarshabandi@gmail.com" class="w-full bg-slate-950/80 border border-slate-800 focus:border-blue-500 text-slate-100 px-4 py-3 rounded-xl focus:outline-none text-sm transition-all">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 block">Password</label>
                <input type="password" id="password" required placeholder="drvarsha@07" class="w-full bg-slate-950/80 border border-slate-800 focus:border-blue-500 text-slate-100 px-4 py-3 rounded-xl focus:outline-none text-sm transition-all">
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2">
                <span>Access EMR Workspace</span>
                <span>🔑</span>
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-slate-500">
            Authorized Medical Staff Only. 
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnSubmit');

            errorMsg.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Verifying Authenticity...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('doctorToken', data.token);
                    localStorage.setItem('doctorName', data.doctorName);
                    window.location.href = '/doctor.html';
                } else {
                    errorMsg.innerText = data.error || 'Invalid doctor credentials.';
                    errorMsg.classList.remove('hidden');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>Access EMR Workspace</span><span>🔑</span>';
                }
            } catch (err) {
                errorMsg.innerText = 'Network or connection failure. Please verify server is live.';
                errorMsg.classList.remove('hidden');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Access EMR Workspace</span><span>🔑</span>';
            }
        });
    </script>
</body>
</html>
